; Model presets for llama-fim.sh (llama-server router mode).
; Each [section] is a model; requests pick one with "model": "<section name>".
; Keys are llama-server flags without the leading dashes.
; Precedence: command line > model section > [*].
version = 1

[*]
ctx-size = 8192
n-gpu-layers = 999
load-mode = mlock
cache-type-k = f16
cache-type-v = f16
cache-reuse = 256
jinja = true
flash-attn = on
parallel = 1

[qwen3.5-2b-chat]
; Qwen3.5-2B for general chat / writing.
model = /home/user/aimodels/llms/Qwen3.5-2B-IQ4_XS.gguf
mmproj = /home/user/aimodels/llms/Qwen3.5-2B-mmproj-BF16.gguf
ctx-size = 81920
; Thinking on. The model card warns the 2B model is prone to thinking loops, so cap it.
reasoning = on
reasoning-budget = 1024
; Model card, thinking mode "text tasks" row. presence-penalty curbs the repetition
; loops this small model falls into ("adjust between 0 and 2 to reduce endless repetitions").
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0
presence-penalty = 1.5
repeat-penalty = 1.0

[qwen3.5-2b-code]
; Same model, tuned for coding (chat about code, inline assist).
model = /home/user/aimodels/llms/Qwen3.5-2B-IQ4_XS.gguf
mmproj = /home/user/aimodels/llms/Qwen3.5-2B-mmproj-BF16.gguf
ctx-size = 81920
; Thinking on. The model card warns the 2B model is prone to thinking loops, so cap it.
reasoning = on
reasoning-budget = 1024
; Model card, thinking mode "precise coding (e.g. WebDev)" row. No presence penalty:
; code reuses identifiers constantly.
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
presence-penalty = 0
repeat-penalty = 1.0

[qwen2.5-coder-1.5b-base]
; Base (non-instruct) model, the one llama.cpp's --fim-qwen-1.5b-default preset uses.
; No sampling overrides, like that preset: server defaults or what the client sends.
model = /home/user/aimodels/llms/qwen2.5-coder-1.5b-q8_0.gguf
batch-size = 1024
ubatch-size = 1024
load-on-startup = true

[Cyber-Tiel-Coder-35B-A3B-MTP]
; Same settings as llama-cybertiel.sh. The name matches that script's --alias.
; On CUDA, llama-fim.sh adds --n-cpu-moe 40 like llama-cybertiel.sh does.
model = /home/user/aimodels/llms/Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL.gguf
load-on-startup = true
mmproj = /home/user/aimodels/llms/mmproj-BF16.gguf
reasoning = on
ctx-size = 81920
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
